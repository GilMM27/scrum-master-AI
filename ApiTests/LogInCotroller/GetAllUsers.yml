info:
  name: GetAllUsers
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/users"
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const targetUsername = bru.getVar("username");
        const users = res.getBody();
        if (users && Array.isArray(users) && users.length > 0) {
          const user = users.find(u => u.username === targetUsername);
          if (user) {
            bru.setVar("userId", user.userId);
            console.log("Found userId for " + targetUsername + ": " + user.userId);
          } else {
            console.error("Could not find user with username: " + targetUsername);
            // Fallback for continuity if needed, but the user wants to use the created one
            bru.setVar("userId", users[0].userId);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

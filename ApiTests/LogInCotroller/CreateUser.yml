info:
  name: CreateUser
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "username" : "{{username}}",
        "email" : "{{email}}",
        "password" : "{{password}}",
        "cellPhone" : "123456789",
        "userRole" : "ADMIN"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const timestamp = Date.now();
        const randomStr = Math.random().toString(36).substring(2, 8);
        const username = "user_" + timestamp + "_" + randomStr;
        const email = "user_" + timestamp + "_" + randomStr + "@example.com";
        const password = "pass" + timestamp;
        
        bru.setVar("username", username);
        bru.setVar("email", email);
        bru.setVar("password", password);
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setVar("BearThoken", res.getBody().token);
          console.log("Token captured from registration");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Create Sprint of Projet
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/sprints"
  body:
    type: json
    data: |-
      {
        "projectId": "{{ProjectVar}}",
        "name": "{{dynamicSprintName}}", 
        "startDate": "2026-04-15",
        "endDate": "2026-04-25",
        "status": "PLANNED"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("dynamicSprintName", "Sprint " + Date.now());

    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setVar("sprint", res.getBody().sprintId);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

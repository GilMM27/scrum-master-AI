info:
  name: Testing creation of tasks
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/tasks"
  body:
    type: json
    data: |-
      {
        "title": "newTest Some",
        "description": "Add login functionality with JWT tokens",
      //   "sprintId":"b6571da-d574-4b77-948a-2fff48f639ef",
        "projectId":"{{ProjectVar}}",
        
        
        "storyPoints": 5
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201 || res.getStatus() === 200) {
          bru.setVar('TestTaskId', res.getBody().taskId);
          console.log("Created TestTaskId: " + bru.getVar('TestTaskId'));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

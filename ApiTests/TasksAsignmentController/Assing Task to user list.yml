info:
  name: Assing Task to user list
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/tasks/{{TestTaskId}}/assignees"
  body:
    type: json
    data: |-
      {
        "assigneeIds": [
          "{{userId}}"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Create Project
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/projects"
  body:
    type: json
    data: |-
      {
        "name": "{{dynamicProjectName}}",
        "description": "Optional description"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("dynamicProjectName", "Project " + Date.now());

    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setVar("ProjectVar", res.getBody().projectId);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
